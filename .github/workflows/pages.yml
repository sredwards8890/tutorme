name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "spike/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            spike/package-lock.json

      # The app is the site root: https://<user>.github.io/tutorme/
      - run: npm ci
        working-directory: app
      - run: npm run build:pages
        working-directory: app

      # The spike stays reachable under /spike/ for device re-tests.
      - run: npm ci
        working-directory: spike
      - run: npm run build -- --mode pages
        working-directory: spike
      - run: mkdir -p app/dist/spike && cp -r spike/dist/. app/dist/spike/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
